<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="agy_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="agy_cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="agy_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#8B5CF6" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#agy_glow)">
    <!-- Antigravity Outer Orbital Ring -->
    <ellipse cx="32" cy="32" rx="24" ry="12" transform="rotate(-30 32 32)" stroke="url(#agy_cyan)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.8"/>
    
    <!-- Central Levitation Prism / Inverted Quantum Core -->
    <polygon points="32,10 52,44 12,44" fill="url(#agy_body)"/>
    
    <!-- Internal Zero-G Facet Highlighting -->
    <polygon points="32,10 32,44 52,44" fill="#A78BFA" opacity="0.45"/>
    <polygon points="32,22 42,40 22,40" fill="#1E1B4B" opacity="0.6"/>

    <!-- Central Levitating Energy Spark / Sphere -->
    <circle cx="32" cy="34" r="4.5" fill="#38BDF8"/>
    <circle cx="32" cy="34" r="2" fill="#FFFFFF"/>
  </g>
</svg>
