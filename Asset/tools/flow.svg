<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="flow_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#2B66C4"/>
    </linearGradient>
    <linearGradient id="flow_red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#C5221F"/>
    </linearGradient>
    <linearGradient id="flow_yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#F29900"/>
    </linearGradient>
    <linearGradient id="flow_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#188038"/>
    </linearGradient>
    <filter id="flow_glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#flow_glow)">
    <!-- Cinematic Video Flow Ribbon - Loop Arc 1 (Blue) -->
    <path d="M12 28C12 18 19 10 29 10C37 10 43 15 45 22L36 27C34.5 22 32 18 28 18C22 18 19 22 19 28C19 32 21 36 25 39L18 45C14 41 12 35 12 28Z" fill="url(#flow_blue)"/>

    <!-- Loop Arc 2 (Red - Top Right) -->
    <path d="M29 10C39 10 49 16 52 26C54 32 53 39 49 45L41 39C43 35 44 31 43 27C41 21 36 18 30 18L29 10Z" fill="url(#flow_red)"/>

    <!-- Loop Arc 3 (Yellow - Bottom Right Play Crest) -->
    <path d="M52 26L43 31C44 36 42 41 38 44C33 48 26 47 21 43L15 50C23 56 34 56 43 51C49 46 53 37 52 26Z" fill="url(#flow_yellow)"/>

    <!-- Loop Arc 4 (Green - Bottom Return Arc) -->
    <path d="M18 45L25 39C22 36 21 32 21 28L12 28C12 35 14 41 18 45Z" fill="url(#flow_green)"/>

    <!-- Center Cinematic Prism / Play Node -->
    <polygon points="30,25 40,32 30,39" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
