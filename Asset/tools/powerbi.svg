<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pbi_col1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C811"/>
      <stop offset="100%" stop-color="#D99B00"/>
    </linearGradient>
    <linearGradient id="pbi_col2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8A615"/>
      <stop offset="100%" stop-color="#C27A00"/>
    </linearGradient>
    <linearGradient id="pbi_col3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D68612"/>
      <stop offset="100%" stop-color="#9E5300"/>
    </linearGradient>
    <filter id="pbi_shadow" x="-15%" y="-10%" width="130%" height="120%">
      <feDropShadow dx="-1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Right Tallest Bar -->
  <rect x="40" y="8" width="13" height="48" rx="4" fill="url(#pbi_col3)" opacity="0.95"/>

  <!-- Middle Bar -->
  <rect x="26" y="20" width="13" height="36" rx="4" fill="url(#pbi_col2)" filter="url(#pbi_shadow)"/>

  <!-- Left Shortest Bar -->
  <rect x="12" y="32" width="13" height="24" rx="4" fill="url(#pbi_col1)" filter="url(#pbi_shadow)"/>

  <!-- Light highlights on top edges -->
  <rect x="13" y="33" width="11" height="2" rx="1" fill="#FFFFFF" opacity="0.4"/>
  <rect x="27" y="21" width="11" height="2" rx="1" fill="#FFFFFF" opacity="0.4"/>
  <rect x="41" y="9" width="11" height="2" rx="1" fill="#FFFFFF" opacity="0.4"/>
</svg>
